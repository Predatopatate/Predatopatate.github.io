<style>
:root{--page:#fff;--sky1:#9fd0ff;--sky2:#cfe6ff;--win:#fff;--ink:#3b3b3b;--mute:#6b6b6b;--bar:#444;--accent:#f59300;--sh:#0003;--pet:#f2a65a;--petEye:#2b2b2b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0d1626;--sky1:#1d3c66;--sky2:#0f2342;--win:#16243a;--ink:#e8eef7;--mute:#9fb0c6;--bar:#2a3b55;--accent:#ffb347;--sh:#0008;color-scheme:dark}}

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--page);color:var(--ink);font-family:"Quicksand",ui-rounded,"Segoe UI",system-ui,sans-serif;overflow:hidden}
button,a{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.desk{position:relative;height:100%;overflow:hidden}
.sky{position:absolute;left:0;bottom:0;width:100%;height:38%;pointer-events:none}
.tools{position:absolute;left:14px;top:12px;display:flex;gap:10px;align-items:center;z-index:50}
.ib{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;border-radius:10px}
.ib:hover{background:#00000012}
.lg{font-family:"Roboto Mono",ui-monospace,monospace;font-weight:700;font-size:.85rem;width:auto;padding:0 10px;border:2px solid var(--ink)}
.stage{position:absolute;inset:0 0 70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none;padding:56px 0 0}
.star{align-self:flex-start;margin-left:max(4vw,calc(50% - 400px));pointer-events:none}
.win{background:var(--win);border-radius:12px;box-shadow:0 4px 0 var(--sh),0 12px 28px #0002;overflow:hidden;display:flex;flex-direction:column;pointer-events:auto}
.win header{background:var(--bar);color:#fff;padding:13px 14px 13px 24px;font-weight:700;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;gap:8px;user-select:none;touch-action:none;cursor:grab}

.home{position:relative;width:min(800px,92vw);height:min(600px,100%)}
.home header{cursor:default}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
.hero h1{margin:0;font-weight:400;font-size:clamp(2.2rem,7.2vw,4.4rem);line-height:1.05}

#icons{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,2vw,22px);margin-top:clamp(18px,6vh,56px)}
.ico{width:96px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);padding:4px}

.foot{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:.78rem;color:var(--ink);z-index:3}
.foot div{display:flex;gap:10px;justify-content:center;margin-bottom:4px}
.soc{width:38px;height:38px;border-radius:50%;background:#444;color:#fff;display:grid;place-items:center;font-weight:700;text-decoration:none}
.w{position:absolute;width:min(460px,calc(100% - 16px));max-height:calc(100% - 90px);animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.x{width:28px;height:28px;border-radius:8px;border:0;background:#ffffff26;color:#fff;font-size:1.2rem;line-height:1}
.x:hover{background:#ffffff44}
.body{padding:16px 20px 20px;overflow:auto;line-height:1.55;font-size:.97rem}
.body h2{font-size:1.6rem;line-height:1.1;margin:0 0 8px}
.body h3{font-size:1rem;margin:14px 0 6px}
.body p{margin:0 0 10px;max-width:62ch}

.tag{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;margin:0 6px 6px 0;font-size:.82rem;font-weight:600}
.case{border:2px solid var(--bar);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.case b{display:block}.case small{color:var(--mute)}.case ul{margin:6px 0 0;padding-left:18px}.case ul:empty{display:none}.case li{margin-bottom:3px}
.note{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);z-index:900;background:var(--win);border-radius:12px;box-shadow:0 4px 0 var(--sh);padding:10px 14px;font-size:.9rem;display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100% - 20px)}

@media (max-width:700px){.w{left:8px!important;top:64px!important}.win header{cursor:default}.stage{padding-top:70px}}

.win header{font-family:"Roboto Mono",ui-monospace,monospace;font-weight:700;text-transform:lowercase}
.x{width:auto;height:auto;background:none;color:#fff;font-family:"Roboto Mono",ui-monospace,monospace;font-weight:700;font-size:1rem;padding:2px 4px}
.x:hover{background:none;color:var(--accent)}
.body{padding:0}
.pad{padding:8px 36px 28px}
.body>:not(.prof):not(.sep):not(.pad):not(.lrow){margin-left:28px;margin-right:28px}
.body>:first-child{margin-top:22px}
.body>:last-child{margin-bottom:26px}
.prof{display:flex;flex-wrap:wrap;align-items:center;gap:26px;padding:30px 36px}
.av{width:140px;height:140px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:3rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#2b6a8f,#7ec8c0);box-shadow:0 4px 0 var(--sh)}
.prof h2{color:var(--accent);font-size:clamp(2rem,6vw,3.2rem);font-weight:600;margin:0 0 6px}

.sep{border-top:1px solid #0002;margin:0}
.body h3{font-family:"Roboto Mono",ui-monospace,monospace;text-transform:uppercase;font-size:1.2rem;margin:18px 0 12px}
.body ul{padding-left:22px}.body li{margin-bottom:8px}
.body a{text-decoration:underline}
.tag{border:0;border-radius:6px;padding:6px 12px;font-weight:400;font-size:.88rem;background:var(--win);box-shadow:0 3px 0 var(--sh),0 0 0 1px #0001;margin:0 8px 10px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.card{border-radius:10px;overflow:hidden;box-shadow:0 3px 0 var(--sh),0 0 0 1px #0001}
.thumb{aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
.thumb b{font-size:1.6rem;line-height:1.1}.thumb small{opacity:.9}
.cb{padding:6px 14px 8px;font-size:.9rem}.cb ul{padding-left:18px}.cb li{margin-bottom:5px}
.lrow{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;padding:32px 20px}
a.ico{text-decoration:none}
details{border-bottom:1px solid #0002;padding:10px 0}
summary{font-family:"Roboto Mono",ui-monospace,monospace;font-weight:700;cursor:pointer}
details p{margin:8px 0 2px}
.fm label{display:block;font-family:"Roboto Mono",ui-monospace,monospace;font-size:.82rem;margin:12px 0 4px}
.fm input,.fm textarea{width:100%;font:inherit;padding:9px 12px;border:1px solid #0003;border-radius:8px;background:var(--win);color:var(--ink)}
.btn{display:inline-block;margin-top:16px;background:var(--accent);color:#222!important;border-radius:8px;padding:9px 22px;font-weight:700;text-decoration:none!important;font-family:"Roboto Mono",ui-monospace,monospace}
@media (max-width:700px){.cols{grid-template-columns:1fr}.pad{padding:8px 20px 24px}.prof{padding:22px 20px}}

:root{--pt:#d3e8ff;--starO:0;--cloudO:.95}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pt:#0a1222;--starO:1;--cloudO:.06}}

body{background:linear-gradient(var(--pt),var(--page) 62%)}
.sky{overflow:hidden}
.sky svg{position:absolute;left:0;width:200%;height:100%;animation:wave var(--t,30s) linear infinite}

.clouds,.stars{position:absolute;inset:0 0 38%;pointer-events:none}
.stars{opacity:var(--starO);transition:opacity .6s}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.cl{position:absolute;left:-220px;width:110px;height:30px;border-radius:30px;background:#fff;opacity:var(--cloudO);animation:drift var(--t) linear infinite;animation-delay:var(--dl,0s)}
.cl:before,.cl:after{content:"";position:absolute;border-radius:50%;background:inherit}

@keyframes drift{to{transform:translateX(calc(100vw + 360px))}}
.av{position:relative;cursor:default;overflow:hidden;width:160px;height:160px;box-shadow:0 0 0 4px var(--win),0 0 0 7px var(--accent)}
.av img{width:100%;height:100%;object-fit:cover;display:block}

.prof{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--win)),var(--win) 70%)}
.badge{display:inline-flex;align-items:center;gap:8px;background:#2fb36624;border-radius:999px;padding:4px 12px;font-weight:600;font-size:.85rem;margin-bottom:10px}
.badge:before{content:"";width:9px;height:9px;border-radius:50%;background:#2fb366;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #2fb36600;opacity:.6}}
.wave{display:inline-block;animation:wv 2.4s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wv{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.lead{font-size:1.1rem}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.gal button{border:0;padding:0;border-radius:6px;overflow:hidden;aspect-ratio:1;background:#0001;cursor:zoom-in;box-shadow:0 3px 0 var(--sh)}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.gal button:hover img{transform:scale(1.06)}
.ph{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:"Roboto Mono",ui-monospace,monospace;font-size:.85rem;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:.92}
.more{margin-top:14px;font-size:.92rem}
.proj{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}

.proj>div+div{flex:1;min-width:220px}
#lb,#mm{position:fixed;inset:0;z-index:3000;display:none;place-items:center;background:#000c}
#lb.on,#mm.on{display:grid}
#lbi{max-width:88vw;max-height:86vh;border-radius:8px;box-shadow:0 8px 40px #0008}
.lbn{position:absolute;border:0;background:#ffffff22;color:#fff;width:46px;height:46px;border-radius:50%;font-size:1.8rem;line-height:1}
.lbn:hover{background:#ffffff44}
#lbp{left:14px}#lbn{right:14px}#lbx{right:14px;top:14px}
.mbox{background:var(--win);border-radius:12px;padding:22px;width:min(420px,92vw);box-shadow:0 4px 0 var(--sh)}
.mbox h2{margin:0 0 6px;font-size:1.4rem}.mbox p{margin:0 0 12px;color:var(--mute)}
.mo{display:block;padding:12px 14px;margin:8px 0;border-radius:8px;box-shadow:0 3px 0 var(--sh),0 0 0 1px #0002;text-decoration:none;font-weight:700;color:var(--ink)}
.mo:hover{background:color-mix(in srgb,var(--accent) 16%,var(--win))}
.mrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mrow button{border:1px solid #0003;border-radius:8px;background:none;padding:7px 14px;font-weight:600}

#pet{position:absolute;z-index:5;width:56px;height:56px;left:calc(100% - 110px);top:calc(100% - 150px);pointer-events:none;filter:drop-shadow(0 5px 3px #0003);transition:left var(--d,1s) cubic-bezier(.4,.1,.3,1),top var(--d,1s) cubic-bezier(.4,.1,.3,1)}
#pet .rot{width:100%;height:100%;transform:rotate(var(--rot,-14deg));transition:transform .3s}
#pet svg{display:block;animation:bob 3s ease-in-out infinite}

@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
.tr{position:absolute;z-index:4;width:7px;height:7px;margin:-3px;border-radius:50%;background:var(--accent);opacity:.8;pointer-events:none;animation:fade .9s ease-out forwards}
@keyframes fade{to{opacity:0;transform:scale(.2)}}
.sp{position:absolute;z-index:6;width:12px;height:12px;margin:-6px;background:var(--accent);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);pointer-events:none;animation:burst .7s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(1.2)}to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.thumb.hasimg{background-color:#fff;background-size:contain;background-repeat:no-repeat;background-position:center;padding:0}

.btn2{display:inline-block;background:#c9f7ff;color:#16243a!important;border-radius:8px;padding:12px 24px;font-weight:700;text-decoration:none!important}
.btn2:hover{background:#fff}

:root{--edge:transparent;--pan:#eef3f8;--line:#0003}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#151515;--pt:#151515;--sky1:#14607f;--sky2:#0a2540;--win:#0e1c31;--ink:#e8f3f9;--mute:#9fb6c8;--bar:#0e1c31;--accent:#b8f1ff;--sh:#0009;--edge:#b8f1ff;--pan:#08111f;--line:#ffffff88}}

.win{border:1px solid var(--line)}

.star{pointer-events:auto;background:none;border:0;padding:0;cursor:pointer;position:relative}
.star:hover svg{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-14deg) scale(1.1)}75%{transform:rotate(14deg) scale(1.1)}}
.stip{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:700 .68rem "Roboto Mono",ui-monospace,monospace;color:var(--ink);opacity:0;transition:opacity .2s;white-space:nowrap}

.callout{background:#3d7ab5;color:#fff;border-radius:6px;padding:12px 16px;font-size:.92rem}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.lnote{border:1px solid var(--line);border-radius:4px;padding:6px 14px;font-size:.8rem;width:fit-content;margin:0 auto 24px!important;text-align:center}

.ans{background:var(--pan);padding:10px 16px;border-radius:0 0 4px 4px}

[data-copy]{position:relative}

.gal{grid-template-columns:repeat(4,1fr)}

.ph{position:relative;cursor:pointer;overflow:hidden;background-size:cover;background-position:center;border:0}

 about:{w:780,t:{fr:'à propos',en:'about'},h:{

 faq:{w:560,t:{fr:'faq',en:'faq'},h:{
  fr:faq([['Quel poste cherches-tu ?','Un CDI en SEO / content strategy, à Bordeaux. J’aime mêler SEO technique, stratégie de contenu et coordination d’équipes.'],['Que faisais-tu chez Eskimoz ?','En alternance (sept. 2024 – oct. 2025) : audits SEO/GEO, optimisation de contenus pour des clients internationaux, suivi des KPI et coordination de freelances.'],['Qu’est-ce que le GEO ?','L’optimisation des contenus pour qu’ils apparaissent aussi dans les réponses des moteurs génératifs (LLM, SGE), pas seulement dans les résultats classiques.'],['Quel est ton niveau technique ?','À l’aise avec Analytics, Search Console, SEMrush, Ahrefs, Screaming Frog et Looker Studio ; HTML/CSS et bases de Python. J’ai travaillé avec des développeurs sur l’indexation, les Core Web Vitals et les données structurées.'],['Pourquoi du droit avant le marketing ?','Licence de droit des affaires (2018 – 2022), puis BBA et MSc en marketing digital. J’en garde l’habitude de lire des contrats et une vraie sensibilité RGPD / conformité éditoriale.'],['Langues et certifications ?','Français (natif), anglais (C1, TOEIC), espagnol (A2). Certifié Google Analytics, et Business and Sustainable Development Certificate (UN Global Compact Network UK).'],['Et en dehors du travail ?','Je dessine, j’écris et j’anime des parties de jeux de rôle. Tout est dans l’onglet « Personnel ».'],['Comment te contacter, ou récupérer ton CV ?','Par e-mail : amaurysutre@gmail.com, ou via la fenêtre « contact ». Mon CV se cache derrière le soleil (ou la lune), au-dessus de la fenêtre d’accueil.'],['Y a-t-il des secrets sur le site ?','Si tu connais le Konami code, essaie-le avec ton clavier : un petit jeu t’attend.</li><li>Clique cinq fois de suite sur mon logo, en haut à gauche, pour changer l’ambiance.</li><li>L’oiseau qui se balade sur le bureau est plus joueur qu’il n’en a l’air : clique dessus.']]),
  en:faq([['What role are you looking for?','A permanent role in SEO / content strategy, in Bordeaux. I like combining technical SEO, content strategy and team coordination.'],['What did you do at Eskimoz?','Work-study (Sept 2024 – Oct 2025): SEO/GEO audits, content optimization for international clients, KPI tracking and freelancer coordination.'],['What is GEO?','Optimizing content so that it also shows up in the answers of generative engines (LLMs, SGE), not only in classic results.'],['How technical are you?','Comfortable with Analytics, Search Console, SEMrush, Ahrefs, Screaming Frog and Looker Studio; HTML/CSS and Python basics. I have worked with developers on indexing, Core Web Vitals and structured data.'],['Why law before marketing?','Bachelor’s degree in business law (2018 – 2022), then a BBA and an MSc in digital marketing. I kept the habit of reading contracts and a real sensitivity to GDPR and editorial compliance.'],['Languages and certifications?','French (native), English (C1, TOEIC), Spanish (A2). Google Analytics certified, plus the Business and Sustainable Development Certificate (UN Global Compact Network UK).'],['And outside of work?','I draw, write and run tabletop role-playing games. It is all in the “Personal” tab.'],['How can I contact you, or get your resume?','By e-mail: amaurysutre@gmail.com, or through the “contact” window. My resume is hiding behind the sun (or the moon) above the home window.'],['Are there any secrets on the site?','If you know the Konami code, try it on your keyboard: a little game is waiting.</li><li>Click my logo at the top left five times in a row to change the mood.</li><li>The bird wandering around the desktop is more playful than it looks: click on it.']])}},

 en:{doc:'Amaury Sutre — Portfolio',home:'home',a:'hi! ',b:'I’m Amaury',sub:'content strategist & SEO specialist, Bordeaux',lang:'FR',dark:'Switch to dark mode',light:'Switch to light mode',on:'Mute sounds',off:'Turn sounds on',close:'Close',note:'This desktop works best on a computer.',navl:'Sections'}};

const SPK='<path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/>',SON=SPK+'<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',SOFF=SPK+'<path d="M16 9l5 6M21 9l-5 6"/>';
/* thème */
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
function paintTheme(){const b=$('#tTheme');b.innerHTML=sm(isDark()?MOON:SUN);b.setAttribute('aria-label',isDark()?u('light'):u('dark'))}
const st=store.get('theme');if(st)root.dataset.theme=st;
$('#tTheme').onclick=()=>{root.dataset.theme=isDark()?'light':'dark';store.set('theme',root.dataset.theme);paintTheme();isDark()?sfx(440,.16,'sine',.08,660):sfx(660,.16,'sine',.08,440)};
/* sons (WebAudio) */
let sound=store.get('sfx')!=='off',ac;
function paintSfx(){const b=$('#tSfx');b.innerHTML=sm(sound?SON:SOFF);b.setAttribute('aria-label',sound?u('on'):u('off'))}
function sfx(f,d=.1,type='triangle',v=.12,f2){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+d);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
$('#tSfx').onclick=()=>{sound=!sound;store.set('sfx',sound?'on':'off');paintSfx();sfx(784,.09,'sine',.08)};

function applyLang(){
 root.lang=lang;document.title=u('doc');$('#star .stip').textContent=lang==='fr'?'cv':'resume';$('#star').setAttribute('aria-label',lang==='fr'?'CV':'Resume');$('#tLang').textContent=u('lang');
 paintScene();
 Object.keys(wins).forEach(k=>fill(wins[k],k));paintTheme();paintSfx();
}

/* fenêtres */
let z=10,n=0;
function front(el){el.style.zIndex=++z;const i=stack.indexOf(el);if(i>-1)stack.splice(i,1);stack.push(el)}
function closeWin(k){const el=wins[k];if(!el)return;el.classList.add('out');setTimeout(()=>el.remove(),160);delete wins[k];const i=stack.indexOf(el);if(i>-1)stack.splice(i,1);sfx(520,.18,'sine',.07,330)}
function openWin(k){
 if(wins[k]){front(wins[k]);return}
 const el=document.createElement('section');el.className='win w'+(W[k].cls?' '+W[k].cls:'');el.setAttribute('role','dialog');
 el.innerHTML='<header><span class="wt"></span><button class="x">[x]</button></header><div class="body"></div>';fill(el,k);
 const r=desk.getBoundingClientRect(),w=Math.min(W[k].w||460,r.width-16);el.style.width=w+'px';el.style.left=Math.max(8,(r.width-w)/2+((n%4)-1.5)*60)+'px';el.style.top=(60+(n%4)*38)+'px';n++;
 desk.appendChild(el);wins[k]=el;front(el);sfx(WS[k]||523,.28,'sine',.09,(WS[k]||523)*1.03);
 el.addEventListener('pointerdown',()=>front(el));
 el.querySelector('.x').onclick=()=>closeWin(k);
 const h=el.querySelector('header');let ox,oy;
 h.addEventListener('pointerdown',e=>{if(narrow()||e.target.closest('.x'))return;ox=e.clientX-el.offsetLeft;oy=e.clientY-el.offsetTop;h.setPointerCapture(e.pointerId);h.classList.add('drag')});
 h.addEventListener('pointermove',e=>{if(!h.hasPointerCapture(e.pointerId))return;const R=desk.getBoundingClientRect();el.style.left=Math.max(0,Math.min(R.width-el.offsetWidth,e.clientX-ox))+'px';el.style.top=Math.max(0,Math.min(R.height-60,e.clientY-oy))+'px'});
 h.addEventListener('pointerup',e=>{h.classList.remove('drag');if(h.hasPointerCapture(e.pointerId))h.releasePointerCapture(e.pointerId)});
}
addEventListener('keydown',e=>{if(e.key==='Escape'&&!closeOverlays()&&stack.length){const el=stack[stack.length-1];const k=Object.keys(wins).find(x=>wins[x]===el);if(k)closeWin(k)}});

const pet=$('#pet');let trT=0;
function spark(x,y){for(let i=0;i<7;i++){const d=document.createElement('i');d.className='sp';const a=i/7*6.283+Math.random()*.5,r=26+Math.random()*22;d.style.cssText='left:'+x+'px;top:'+y+'px;--dx:'+Math.cos(a)*r+'px;--dy:'+Math.sin(a)*r+'px';desk.appendChild(d);setTimeout(()=>d.remove(),700)}}
desk.addEventListener('pointerdown',e=>{
 if(e.target!==desk)return;
 const R=desk.getBoundingClientRect(),x=e.clientX-R.left,y=e.clientY-R.top,cx=pet.offsetLeft+28,cy=pet.offsetTop+28,dist=Math.hypot(x-cx,y-cy);
 spark(x,y);if(dist<10)return;
 pet.style.setProperty('--dir',x<cx?-1:1);pet.style.setProperty('--tilt',Math.max(-35,Math.min(35,Math.atan2(y-cy,Math.abs(x-cx))*180/Math.PI))+'deg');pet.style.setProperty('--d',Math.min(2,dist/380+.4)+'s');
 pet.classList.add('fly');pet.style.left=(x-28)+'px';pet.style.top=(y-28)+'px';sfx(380,.3,'sine',.05,820);
 clearInterval(trT);trT=setInterval(()=>{const d=document.createElement('i');d.className='tr';d.style.left=(pet.offsetLeft+28)+'px';d.style.top=(pet.offsetTop+28)+'px';desk.insertBefore(d,pet);setTimeout(()=>d.remove(),900)},45);
});
pet.addEventListener('transitionend',e=>{if(e.propertyName==='left'||e.propertyName==='top'){pet.classList.remove('fly');clearInterval(trT);pet.style.setProperty('--tilt','0deg');pet.classList.add('land');setTimeout(()=>pet.classList.remove('land'),400)}});

const TABS=['pro','perso','contact'];
const SC={pro:['about','work','links','faq'],perso:['draw','write','cinema','games'],contact:[]};
const TL={fr:{pro:'Professionnel',perso:'Personnel',contact:'Contact'},en:{pro:'Professional',perso:'Personal',contact:'Contact'}};
const SU={fr:{pro:{t:'accueil',a:'salut ! ',b:'moi c’est Amaury',sub:'content strategist & SEO, Bordeaux'},perso:{t:'personnel',a:'côté ',b:'perso',sub:'illustration, écriture, cinéma, jeux de rôle'},contact:{t:'contact'}},
 en:{pro:{t:'home',a:'hi! ',b:'I’m Amaury',sub:'content strategist & SEO specialist, Bordeaux'},perso:{t:'personal',a:'the ',b:'personal side',sub:'illustration, writing, cinema, role-playing games'},contact:{t:'contact'}}};
function fromHash(){const h=(location.hash||'').slice(1);return TABS.includes(h)?h:'pro'}
let scene=fromHash();
function paintScene(){const h=$('.home'),sc=SU[lang][scene],hero=$('#hero');$('#homeT').textContent=sc.t;
 if(scene==='contact'){h.classList.add('blue');hero.className='hero';hero.innerHTML=W.contact.h[lang];hero.querySelectorAll('[data-slot]').forEach(paintSlot)}
 else{h.classList.remove('blue');hero.className='hero';hero.innerHTML='<h1><span>'+sc.a+'</span><b>'+sc.b+'</b></h1><p>'+sc.sub+'</p><nav id="icons" aria-label="'+u('navl')+'">'+SC[scene].map(k=>{const d=W[k];return '<button class="ico" data-k="'+k+'">'+big(k)+'<b>'+d.t[lang].toLowerCase()+'</b></button>'}).join('')+'</nav>'}
 document.querySelectorAll('.tabs button').forEach(b=>{b.textContent=TL[lang][b.dataset.tab];b.setAttribute('aria-current',b.dataset.tab===scene)})}
function setScene(n){if(!TABS.includes(n)||n===scene)return;Object.keys(wins).forEach(k=>{wins[k].remove();delete wins[k]});stack.length=0;scene=n;paintScene();const hr=$('#hero');hr.classList.remove('swap');void hr.offsetWidth;hr.classList.add('swap')}
function go(n){try{location.hash=n}catch(x){}setScene(n)}
addEventListener('hashchange',()=>setScene(fromHash()));
